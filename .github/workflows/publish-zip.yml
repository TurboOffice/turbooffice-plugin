name: Publish ZIP
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::720180693798:role/to-prod-plugin-publish-role
          aws-region: us-east-1
      - name: Package the plugin and publish it
        run: |
          python3 scripts/sync-manifests.py --check
          git archive --format=zip -o "$RUNNER_TEMP/turbooffice-plugin.zip" HEAD \
            plugin.json mcp.json .mcp.json .claude-plugin .cursor-plugin skills assets LICENSE
          aws s3 cp "$RUNNER_TEMP/turbooffice-plugin.zip" s3://public-assets-to-prod/downloads/plugin/turbooffice-plugin.zip \
            --content-type application/zip --cache-control "public, max-age=300"
